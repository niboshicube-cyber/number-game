
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUMBER LOGIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:#f3f5fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;min-height:100vh}
.container{width:min(520px,94%);margin:0 auto;padding:28px 0 40px}
h1{font-size:32px;letter-spacing:4px;margin:12px 0 6px}
.subtitle{color:#8d96ad;font-size:12px;letter-spacing:3px;margin-bottom:28px}
button{font:inherit;cursor:pointer}
.mode-buttons{display:flex;gap:12px;margin:24px 0}
.mode-button{flex:1;padding:17px 8px;border:1px solid #414960;border-radius:12px;background:#1b2130;color:#f3f5fc;font-weight:700;font-size:16px}
.mode-button:hover{background:#28334a}
.mode-button small{display:block;margin-top:7px;font-size:11px;color:#9da9c2;font-weight:400}
.info{color:#a7b0c6;font-size:13px;line-height:1.9}
.panel{border:1px solid #323b51;background:#181e2c;border-radius:14px;padding:17px 15px;margin:17px 0}
.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;color:#b7c0d5;flex-wrap:wrap}
#timer{color:#f6d365;font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}
#round{color:#f3f5fc;font-weight:800}
.progress{height:5px;background:#30384b;border-radius:10px;overflow:hidden;margin-top:10px}
#timebar{width:100%;height:100%;background:#f6d365;transition:width .08s linear}
.instruction{border:1px solid #46516b;border-radius:12px;background:#141a27;padding:20px 12px;margin:20px 0;line-height:2;font-size:17px;font-weight:650;overflow-wrap:anywhere}
.logic{display:inline-block;padding:1px 7px;margin:0 3px;border:1px solid #7483a4;border-radius:6px;background:#29334a;color:#d9e4ff;font-size:.9em;white-space:nowrap}
#numbers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:22px 0}
.cell{position:relative;min-width:0}
.num{width:100%;aspect-ratio:1;border:1px solid #414b63;border-radius:12px;background:#20283a;color:#f3f5fc;font-size:24px;font-weight:750;transition:background .12s,border-color .12s,transform .12s}
.num:active{transform:scale(.94)}
.num.correct{background:#1d654e;border-color:#54d6a6;color:#eafff6}
.num.wrong{background:#742e3b;border-color:#ff5364;animation:shake .2s linear}
.num:disabled{cursor:default}
.penalty{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);font-size:19px;font-weight:900;color:#ff5364;text-shadow:0 1px 5px #101522;white-space:nowrap;pointer-events:none;animation:floatUp .85s ease-out forwards}
@keyframes floatUp{0%{opacity:0;translate:0 8px}20%{opacity:1}100%{opacity:0;translate:0 -35px}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.score-display{border:1px solid #46516b;border-radius:14px;background:#181e2c;padding:15px 10px 17px;margin:18px 0}
.score-caption{color:#aeb8ce;font-size:13px;letter-spacing:2px}
.score-value-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:6px}
#score{color:#f6d365;font-size:clamp(38px,10vw,54px);line-height:1.15;font-weight:900;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.score-unit{font-size:16px;color:#f6d365;font-weight:700}
#scoreGain{color:#6de2ae;font-size:20px;font-weight:850;white-space:nowrap;opacity:0;transform:translateY(5px) scale(.92);pointer-events:none}
#scoreGain.show{animation:gainPop .9s ease-out forwards}
#scoreGain.big{color:#ffe16b;font-size:clamp(27px,7vw,36px);text-shadow:0 0 12px rgba(255,225,107,.3)}
@keyframes gainPop{0%{opacity:0;transform:translateY(7px) scale(.85)}18%{opacity:1;transform:translateY(0) scale(1.08)}35%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-9px) scale(1)}}
#message{min-height:24px;color:#b9c6e2;font-size:14px;margin:10px 0}
.primary{width:100%;padding:15px;border:0;border-radius:11px;background:#627cf6;color:white;font-size:16px;font-weight:750;margin-top:12px}
.primary:hover{background:#7890ff}
.secondary{width:100%;padding:13px;border:1px solid #414960;border-radius:11px;background:#1b2130;color:#dce3f5;margin-top:10px}
.hidden{display:none!important}
#result h2{font-size:24px}
#resultScore{font-size:clamp(23px,6vw,32px);font-weight:850;overflow-wrap:anywhere;margin:25px 0}
.result-note{color:#aab4ca;font-size:13px;line-height:1.8}
.version-label{display:inline-block;color:#f6d365;font-size:12px;margin:4px 0 0}
@media(max-width:360px){.container{width:94%}#numbers{gap:7px}.num{font-size:21px}.instruction{font-size:15px}.score-value-row{gap:7px}}
</style>
</head>
<body>
<div class="container">
  <h1>NUMBER LOGIC</h1>
  <div class="subtitle">THINK FAST. FIND THE NUMBERS.</div>

  <section id="menu">
    <p class="info">
      お題の条件に当てはまる数字をタップしよう。<br>
      間違えると残り時間が減るぞ。
    </p>
    <div class="mode-buttons">
      <button class="mode-button" onclick="startGame('normal')">
        初級
        <small>制限時間 5秒</small>
      </button>
      <button class="mode-button" onclick="startGame('advanced')">
        上級
        <small>制限時間 10秒・条件の組み合わせ</small>
      </button>
    </div>
    <div class="panel info">
      数字は1〜10。正解をすべてタップすると得点。<br>
      問題をクリアするたびに制限時間が短くなる。<br>
      誤答すると残り時間が減る。
    </div>
    <button class="secondary" onclick="showVersions()">いままでのバージョン</button>
  </section>

  <section id="versions" class="hidden">
    <p class="info">遊びたいルールを選択してください。</p>
    <div class="panel">
      <button class="mode-button" style="width:100%" onclick="selectVersion('v1')">
        Ver.1　初期ルール
        <small>素数・偶数・奇数・倍数・約数・しきい値</small>
      </button>
      <button class="mode-button" style="width:100%;margin-top:10px" onclick="selectVersion('v2')">
        Ver.2　発展ルール
        <small>条件の組み合わせ・否定条件</small>
      </button>
      <button class="mode-button" style="width:100%;margin-top:10px" onclick="selectVersion('latest')">
        最新版
        <small>現在のルール・得点ボーナス・約数条件</small>
      </button>
    </div>
    <button class="secondary" onclick="backToMenu()">メニューに戻る</button>
  </section>

  <section id="game" class="hidden">
    <div class="topbar">
      <span id="modeLabel">初級</span>
      <span>挑戦 <strong id="round">1</strong> 問目</span>
      <span>残り時間 <strong id="timer">5</strong></span>
    </div>
    <div class="version-label" id="versionLabel"></div>
    <div class="score-display">
      <div class="score-caption">TOTAL SCORE</div>
      <div class="score-value-row">
        <span id="score">0</span>
        <span class="score-unit">点</span>
        <span id="scoreGain" aria-live="polite"></span>
      </div>
    </div>
    <div class="progress"><div id="timebar"></div></div>
    <div id="instruction" class="instruction"></div>
    <div id="numbers"></div>
    <div id="message">当てはまる数字をすべて選ぼう！</div>
    <button class="secondary" onclick="backToMenu()">メニューに戻る</button>
  </section>

  <section id="result" class="hidden">
    <h2>GAME OVER</h2>
    <div id="resultScore"></div>
    <p class="result-note" id="resultNote"></p>
    <button class="primary" onclick="startGame(mode)">もう一度挑戦</button>
    <button class="secondary" onclick="backToMenu()">メニューに戻る</button>
  </section>
</div>

<script>
let mode="normal";
let version="latest";
let q=null;
let score=0;
let questionLimit=5;
let round=0;
let active=false;
let countId=null;
let nextId=null;
let gainId=null;
let deadline=0;
let wrongPenalty=0.5;
let questionLocked=false;
let currentCorrect=new Set();
let selectedCorrect=new Set();
let currentQuestionPoints=0;

const VERSION_NAMES={
  v1:"Ver.1 初期ルール",
  v2:"Ver.2 発展ルール",
  latest:"最新版"
};

function vibrate(pattern){
  try{
    if("vibrate" in navigator)navigator.vibrate(pattern);
  }catch(e){}
}

function clearTimers(){
  if(countId!==null){clearInterval(countId);countId=null;}
  if(nextId!==null){clearTimeout(nextId);nextId=null;}
}

function isPrime(n){
  if(n<2)return false;
  for(let i=2;i*i<=n;i++)if(n%i===0)return false;
  return true;
}

function randomItem(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function showVersions(){
  active=false;
  clearTimers();
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("versions").classList.remove("hidden");
}

function selectVersion(v){
  version=v;
  document.getElementById("versions").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}

function makePredicates(){
  const predicates=[];
  const add=(type,value,label,difficulty,test)=>predicates.push({
    type,value,label,difficulty,test
  });

  for(const item of [
    {label:"3以下",value:3,type:"le"},
    {label:"5以下",value:5,type:"le"},
    {label:"7以下",value:7,type:"le"},
    {label:"4以上",value:4,type:"ge"},
    {label:"6以上",value:6,type:"ge"},
    {label:"8以上",value:8,type:"ge"}
  ]){
    add(item.type,item.value,item.label,500+item.value*10,
      item.type==="le"?n=>n<=item.value:n=>n>=item.value);
  }

  if(version==="v1"){
    add("even",null,"偶数",600,n=>n%2===0);
    add("odd",null,"奇数",600,n=>n%2===1);
  }

  const maxMultiple=version==="v1"?5:10;
  for(let k=1;k<=maxMultiple;k++){
    const difficulty=version==="v1"
      ?700+(6-k)*50
      :800+(11-k)*50;
    add("multiple",k,`${k}の倍数`,difficulty,n=>n%k===0);
  }

  add("square",null,"平方数",
    version==="v1"?1000:1500,
    n=>Number.isInteger(Math.sqrt(n)));

  add("prime",null,"素数",
    version==="v1"?1200:2000,
    n=>isPrime(n));

  const maxN=version==="v1"?30:200;
  for(let N=1;N<=maxN;N++){
    const divisors=[];
    for(let n=1;n<=10;n++)if(N%n===0)divisors.push(n);

    if(version!=="v1"&&divisors.length<3)continue;
    if(version==="v1"&&divisors.length<2)continue;

    const difficulty=version==="v1"
      ?1300+N*5
      :2500+N*5+(divisors.length-3)*500;

    add("divisor",N,`${N}の約数`,difficulty,n=>N%n===0);
  }

  return predicates;
}

function getCorrect(test){
  const result=[];
  for(let n=1;n<=10;n++)if(test(n))result.push(n);
  return result;
}

function makeNormalQuestion(){
  const predicates=makePredicates();
  let p,correct;
  do{
    p=randomItem(predicates);
    correct=getCorrect(p.test);
  }while(correct.length===0||correct.length===10);

  return {
    label:p.label,
    correct,
    predicate:p,
    test:p.test
  };
}

function makeAdvancedQuestion(){
  const all=makePredicates();
  let predicates=all;

  if(version==="latest"){
    const others=all.filter(p=>p.type!=="divisor");
    const divisors=all.filter(p=>p.type==="divisor");
    const questionNumber=round+1;
    const divisorChance=Math.min(0.1,0.01*(questionNumber-1));
    predicates=[
      ...others,
      ...divisors.filter(()=>Math.random()<divisorChance)
    ];
  }

  const firstIndex=Math.floor(Math.random()*predicates.length);
  const first=predicates[firstIndex];
  const remaining=predicates.filter((p,i)=>i!==firstIndex);
  const second=randomItem(remaining);

  const connector=Math.random()<0.5?"and":"or";
  const negateFirst=version==="v1"?false:Math.random()<0.25;
  const negateSecond=version==="v1"?false:Math.random()<0.25;

  const testFirst=n=>negateFirst?!first.test(n):first.test(n);
  const testSecond=n=>negateSecond?!second.test(n):second.test(n);
  const connectorLabel=connector==="and"?"かつ":"または";

  let labelFirst=first.label;
  let labelSecond=second.label;
  if(negateFirst)labelFirst+="ではない";
  if(negateSecond)labelSecond+="ではない";

  const test=n=>{
    const a=testFirst(n),b=testSecond(n);
    return connector==="and"?(a&&b):(a||b);
  };

  return {
    label:`${labelFirst}<span class="logic">${connectorLabel}</span>${labelSecond}`,
    correct:getCorrect(test),
    first,second,connector,
    negationCount:Number(negateFirst)+Number(negateSecond),
    test
  };
}

function makeQuestion(){
  if(mode==="normal")return makeNormalQuestion();

  let question,attempts=0;
  do{
    question=makeAdvancedQuestion();
    attempts++;
  }while(
    (question.correct.length===0||question.correct.length===10)
    &&attempts<100
  );
  return question;
}

function calculateQuestionPoints(question){
  if(mode!=="advanced")return question.predicate.difficulty;

  let points=question.first.difficulty+question.second.difficulty;

  if(question.connector==="and")points+=version==="v1"?0:500;
  points+=question.negationCount*(version==="v1"?0:500);

  return points;
}

function showScoreGain(points){
  const gain=document.getElementById("scoreGain");
  if(gainId!==null){clearTimeout(gainId);gainId=null;}

  gain.classList.remove("show","big");
  void gain.offsetWidth;
  gain.textContent=`+${points.toLocaleString("ja-JP")}`;

  if(points>=4000)gain.classList.add("big");
  gain.classList.add("show");

  gainId=setTimeout(()=>{
    gain.classList.remove("show","big");
    gain.textContent="";
    gainId=null;
  },950);
}

function startGame(selectedMode){
  clearTimers();
  if(gainId!==null){clearTimeout(gainId);gainId=null;}

  const gain=document.getElementById("scoreGain");
  gain.classList.remove("show","big");
  gain.textContent="";

  mode=selectedMode||mode;
  score=0;
  round=0;
  active=true;
  questionLocked=false;

  questionLimit=mode==="advanced"?10:5;

  if(version==="latest"){
    wrongPenalty=mode==="normal"?0.5:1.5;
  }else{
    wrongPenalty=0;
  }

  document.getElementById("menu").classList.add("hidden");
  document.getElementById("versions").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  document.getElementById("modeLabel").textContent=
    mode==="advanced"?"上級":"初級";
  document.getElementById("versionLabel").textContent=VERSION_NAMES[version];
  document.getElementById("score").textContent="0";

  nextQuestion();
}

function nextQuestion(){
  if(!active)return;
  clearTimers();

  questionLocked=false;
  selectedCorrect=new Set();
  q=makeQuestion();
  currentCorrect=new Set(q.correct);
  currentQuestionPoints=calculateQuestionPoints(q);

  round++;
  document.getElementById("round").textContent=round;
  document.getElementById("instruction").innerHTML=q.label;
  document.getElementById("message").textContent="当てはまる数字をすべて選ぼう！";

  const board=document.getElementById("numbers");
  board.innerHTML="";

  for(let n=1;n<=10;n++){
    const cell=document.createElement("div");
    cell.className="cell";
    const b=document.createElement("button");
    b.className="num";
    b.textContent=n;
    b.setAttribute("aria-label",`数字${n}`);
    b.addEventListener("click",()=>tap(b,cell,n));
    cell.appendChild(b);
    board.appendChild(cell);
  }

  deadline=Date.now()+questionLimit*1000;
  updateTimer();
  countId=setInterval(updateTimer,40);
}

function updateTimer(){
  if(!active||questionLocked)return;
  const remaining=(deadline-Date.now())/1000;

  document.getElementById("timer").textContent=
    Math.max(0,Math.ceil(remaining));
  document.getElementById("timebar").style.width=
    Math.max(0,Math.min(100,remaining/questionLimit*100))+"%";

  if(remaining<=0)endGame();
}

function tap(button,cell,n){
  if(!active||questionLocked||button.disabled)return;
  button.disabled=true;

  if(q.test(n)){
    button.classList.add("correct");
    selectedCorrect.add(n);
    document.getElementById("message").textContent="正解！";
    vibrate(15);

    if(selectedCorrect.size===currentCorrect.size){
      questionLocked=true;
      clearTimers();

      // 残り時間が制限時間の50%以上なら1.5倍。
      // 約数条件を1つでも含む問題なら2倍。
      // 両方に該当する場合は約数ボーナスを優先し、2倍のみ。
      let multiplier=1;
      const remaining=Math.max(0,(deadline-Date.now())/1000);
      const hasDivisor=version==="latest"&&(
        q.predicate?.type==="divisor"||
        q.first?.type==="divisor"||
        q.second?.type==="divisor"
      );

      if(version==="latest"){
        if(hasDivisor){
          multiplier=2;
        }else if(remaining/questionLimit>=0.5){
          multiplier=1.5;
        }
      }

      const earnedPoints=Math.round(currentQuestionPoints*multiplier);
      score+=earnedPoints;

      document.getElementById("score").textContent=
        score.toLocaleString("ja-JP");
      showScoreGain(earnedPoints);
      vibrate([25,40,45]);

      let bonusText="";
      if(multiplier===2){
        bonusText="（約数ボーナス2倍）";
      }else if(multiplier===1.5){
        bonusText="（スピードボーナス1.5倍）";
      }

      document.getElementById("message").textContent=
        `完全正解！ +${earnedPoints.toLocaleString("ja-JP")}点${bonusText}`;

      if(version==="latest"){
        questionLimit=Math.max(0.25,questionLimit-0.25);
      }

      nextId=setTimeout(()=>{
        if(active)nextQuestion();
      },350);
    }
  }else{
    button.classList.add("wrong");

    if(wrongPenalty>0){
      deadline-=wrongPenalty*1000;

      const penalty=document.createElement("span");
      penalty.className="penalty";
      penalty.textContent=`−${wrongPenalty}秒`;
      cell.appendChild(penalty);
      setTimeout(()=>{if(penalty.parentNode)penalty.remove();},900);

      document.getElementById("message").textContent=
        `誤答！ −${wrongPenalty}秒`;

      vibrate([70,35,70]);
      updateTimer();
    }else{
      document.getElementById("message").textContent="誤答！";
      vibrate(70);
    }
  }
}

function endGame(){
  if(!active)return;
  active=false;
  questionLocked=true;
  clearTimers();

  document.querySelectorAll(".num").forEach(button=>{
    button.disabled=true;
  });

  document.getElementById("timer").textContent="0";
  document.getElementById("timebar").style.width="0%";
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("resultScore").textContent=
    `獲得得点：${score.toLocaleString("ja-JP")}点`;

  document.getElementById("resultNote").textContent=
    `${VERSION_NAMES[version]}・${mode==="advanced"?"上級":"初級"}に挑戦お疲れさま！ 挑戦した問題数：${round}問`;

  vibrate([80,50,120]);
}

function backToMenu(){
  active=false;
  questionLocked=true;
  clearTimers();

  if(gainId!==null){clearTimeout(gainId);gainId=null;}
  const gain=document.getElementById("scoreGain");
  gain.classList.remove("show","big");
  gain.textContent="";

  try{
    if("vibrate" in navigator)navigator.vibrate(0);
  }catch(e){}

  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("versions").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}
</script>
</body>
</html>
