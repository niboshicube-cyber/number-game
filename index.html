
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Logic</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px 14px;
    background: #101522;
    color: #f3f5fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
  }

  h1 { margin: 4px 0 8px; font-size: 29px; }
  .subtitle { color: #aab4cc; margin-bottom: 22px; }

  button { font: inherit; cursor: pointer; }

  .mode-area {
    display: flex;
    gap: 12px;
    max-width: 440px;
    margin: 20px auto;
  }

  .mode-button {
    flex: 1;
    padding: 17px 8px;
    border: 2px solid #46516b;
    border-radius: 12px;
    background: #1a2234;
    color: white;
  }

  .mode-button strong {
    display: block;
    font-size: 20px;
    margin-bottom: 6px;
  }

  .mode-button span { font-size: 12px; color: #bdc7dc; }

  .mode-button.selected {
    border-color: #71d7ff;
    background: #18364a;
  }

  #game { display: none; max-width: 460px; margin: 0 auto; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin: 18px 0;
  }

  .stat {
    flex: 1;
    padding: 10px 4px;
    background: #1a2234;
    border: 1px solid #35415a;
    border-radius: 10px;
    font-size: 14px;
  }

  .stat strong {
    display: block;
    font-size: 23px;
    margin-top: 4px;
  }

  .instruction-box {
    padding: 17px 10px;
    margin: 16px 0;
    min-height: 72px;
    border: 2px solid #7f91b7;
    border-radius: 12px;
    background: #202b43;
  }

  .instruction-label {
    color: #aebcda;
    font-size: 12px;
    margin-bottom: 8px;
  }

  #instruction {
    font-size: 20px;
    font-weight: bold;
    line-height: 1.7;
  }

  .logic-word {
    display: inline-block;
    padding: 1px 7px;
    margin: 0 2px;
    border: 1px solid #ffc66d;
    border-radius: 5px;
    background: #49391f;
    color: #ffdb99;
  }

  #numbers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
    margin: 18px 0;
  }

  .number-button {
    min-width: 0;
    aspect-ratio: 1 / 1;
    border: 1px solid #465573;
    border-radius: 12px;
    background: #202a40;
    color: white;
    font-size: 27px;
    font-weight: bold;
    transition: background 0.08s;
    -webkit-tap-highlight-color: transparent;
  }

  .number-button:active { transform: scale(0.96); }

  .number-button.correct {
    background: #17684d;
    border-color: #58e0a5;
  }

  .number-button.wrong {
    background: #792f3b;
    border-color: #ff7787;
  }

  #message {
    min-height: 28px;
    margin: 12px 0;
    color: #c8d4ee;
    font-weight: bold;
  }

  .main-button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #71d7ff;
    color: #101522;
    font-weight: bold;
  }

  .secondary-button {
    margin-top: 12px;
    padding: 10px 18px;
    border: 1px solid #53617e;
    border-radius: 9px;
    background: transparent;
    color: #e0e7f7;
  }

  .note {
    color: #9daac4;
    font-size: 12px;
    line-height: 1.7;
    margin-top: 14px;
  }

  #result { display: none; margin: 20px 0; }
</style>
</head>
<body>

<h1>NUMBER LOGIC</h1>
<div class="subtitle">数字を見極めて、正解をタップ！</div>

<div id="modeArea">
  <div class="mode-area">
    <button class="mode-button selected" id="normalMode"
      onclick="selectMode('normal')">
      <strong>初級</strong>
      <span>素数・偶数・倍数など</span>
    </button>
    <button class="mode-button" id="advancedMode"
      onclick="selectMode('advanced')">
      <strong>上級</strong>
      <span>かつ・または・ではない</span>
    </button>
  </div>
  <button class="main-button" onclick="startGame()">ゲームスタート</button>
  <div class="note">
    初級は数の基本的な性質、上級は複数の条件を組み合わせた問題に挑戦！
  </div>
</div>

<div id="game">
  <div class="top-bar">
    <div class="stat">残り時間<strong id="time">5</strong></div>
    <div class="stat">正解数<strong id="score">0</strong></div>
    <div class="stat">数字の更新<strong id="speed">1.00秒</strong></div>
  </div>

  <div class="instruction-box">
    <div class="instruction-label">今回の指示</div>
    <div id="instruction"></div>
  </div>

  <div id="numbers"></div>
  <div id="message">条件に合う数字をすべてタップ！</div>
  <button class="secondary-button" onclick="backToMenu()">モード選択に戻る</button>
</div>

<div id="result">
  <h2>終了！</h2>
  <p id="resultText"></p>
  <button class="main-button" onclick="startGame()">もう一度プレイ</button>
  <br>
  <button class="secondary-button" onclick="backToMenu()">モード選択に戻る</button>
</div>

<script>
const normalQuestions = [
  { text: "素数", test: n => isPrime(n) },
  { text: "偶数", test: n => n % 2 === 0 },
  { text: "奇数", test: n => n % 2 !== 0 },
  { text: "3の倍数", test: n => n % 3 === 0 },
  { text: "4の倍数", test: n => n % 4 === 0 },
  { text: "5の倍数", test: n => n % 5 === 0 },
  { text: "6の約数", test: n => 6 % n === 0 },
  { text: "8以上の数", test: n => n >= 8 },
  { text: "5未満の数", test: n => n < 5 },
  { text: "10の約数", test: n => 10 % n === 0 }
];

const advancedQuestions = [
  {
    text: `素数 <span class="logic-word">かつ</span> 偶数`,
    test: n => isPrime(n) && n % 2 === 0
  },
  {
    text: `3の倍数 <span class="logic-word">または</span> 5の倍数`,
    test: n => n % 3 === 0 || n % 5 === 0
  },
  {
    text: `偶数 <span class="logic-word">ではない</span>`,
    test: n => n % 2 !== 0
  },
  {
    text: `4の倍数 <span class="logic-word">かつ</span> 8未満`,
    test: n => n % 4 === 0 && n < 8
  },
  {
    text: `素数 <span class="logic-word">または</span> 1`,
    test: n => isPrime(n) || n === 1
  },
  {
    text: `3の倍数 <span class="logic-word">でも</span> 5の倍数 <span class="logic-word">でもない</span>`,
    test: n => n % 3 !== 0 && n % 5 !== 0
  },
  {
    text: `2の倍数 <span class="logic-word">かつ</span> 3の倍数`,
    test: n => n % 2 === 0 && n % 3 === 0
  },
  {
    text: `6の約数 <span class="logic-word">または</span> 8の約数`,
    test: n => 6 % n === 0 || 8 % n === 0
  },
  {
    text: `奇数 <span class="logic-word">かつ</span> 5以上`,
    test: n => n % 2 !== 0 && n >= 5
  },
  {
    text: `素数 <span class="logic-word">ではない</span> <span class="logic-word">かつ</span> 3以上`,
    test: n => !isPrime(n) && n >= 3
  }
];

let mode = "normal";
let question = null;
let score = 0;
let timeLeft = 5;
let intervalMs = 1000;
let countdownId = null;
let numberId = null;
let questionId = null;
let gameActive = false;
let answered = new Set();
let requiredNumbers = new Set();
let questionPool = [];

function isPrime(n) {
  if (n < 2) return false;
  for (let i = 2; i * i <= n; i++) {
    if (n % i === 0) return false;
  }
  return true;
}

function selectMode(selected) {
  mode = selected;
  document.getElementById("normalMode").classList.toggle(
    "selected", mode === "normal"
  );
  document.getElementById("advancedMode").classList.toggle(
    "selected", mode === "advanced"
  );
}

function startGame() {
  clearAllTimers();
  score = 0;
  intervalMs = 1000;
  gameActive = true;

  questionPool = [...(mode === "normal" ? normalQuestions : advancedQuestions)];
  shuffle(questionPool);

  document.getElementById("modeArea").style.display = "none";
  document.getElementById("result").style.display = "none";
  document.getElementById("game").style.display = "block";
  document.getElementById("score").textContent = score;

  nextQuestion();
}

function nextQuestion() {
  if (!gameActive) return;

  clearInterval(countdownId);
  clearInterval(numberId);
  clearTimeout(questionId);

  if (questionPool.length === 0) {
    questionPool = [...(mode === "normal" ? normalQuestions : advancedQuestions)];
    shuffle(questionPool);
  }

  question = questionPool.pop();
  answered = new Set();
  timeLeft = 5;

  document.getElementById("time").textContent = timeLeft;
  document.getElementById("speed").textContent =
    (intervalMs / 1000).toFixed(2) + "秒";
  document.getElementById("instruction").innerHTML = question.text;
  document.getElementById("message").textContent =
    "条件に合う数字をすべてタップ！";

  createNumbers();
  updateRequiredNumbers();

  countdownId = setInterval(() => {
    timeLeft -= 1;
    document.getElementById("time").textContent = Math.max(0, timeLeft);
    if (timeLeft <= 0) endQuestion(false);
  }, 1000);

  numberId = setInterval(() => {
    if (!gameActive) return;
    changeNumbers();
  }, intervalMs);

  questionId = setTimeout(() => endQuestion(false), 5000);
}

function createNumbers() {
  const area = document.getElementById("numbers");
  area.innerHTML = "";

  for (let i = 0; i < 16; i++) {
    const button = document.createElement("button");
    button.className = "number-button";
    button.addEventListener("click", () => tapNumber(button));
    area.appendChild(button);
  }
}

function changeNumbers() {
  const buttons = [...document.querySelectorAll(".number-button")];
  buttons.forEach(button => {
    button.textContent = String(1 + Math.floor(Math.random() * 20));
    button.classList.remove("correct", "wrong");
  });
  answered.clear();
  updateRequiredNumbers();
}

function updateRequiredNumbers() {
  requiredNumbers = new Set();
  document.querySelectorAll(".number-button").forEach(button => {
    const n = Number(button.textContent);
    if (question.test(n)) requiredNumbers.add(button);
  });
}

function tapNumber(button) {
  if (!gameActive || button.classList.contains("correct")) return;

  const n = Number(button.textContent);
  if (question.test(n)) {
    button.classList.add("correct");
    answered.add(button);
    score++;
    document.getElementById("score").textContent = score;

    const allCorrect = [...document.querySelectorAll(".number-button")]
      .every(b => !question.test(Number(b.textContent)) || b.classList.contains("correct"));

    if (allCorrect) endQuestion(true);
  } else {
    button.classList.add("wrong");
    document.getElementById("message").textContent = "違う！条件を確認しよう";
    setTimeout(() => button.classList.remove("wrong"), 250);
  }
}

function endQuestion(wasCorrect) {
  if (!gameActive) return;

  clearInterval(countdownId);
  clearInterval(numberId);
  clearTimeout(questionId);

  if (wasCorrect) {
    document.getElementById("message").textContent = "正解！ 次の問題へ";
  } else {
    document.getElementById("message").textContent = "時間切れ！ 次の問題へ";
  }

  // 1問終わるたびに数字の更新を速くする
  intervalMs = Math.max(250, intervalMs - 50);

  questionId = setTimeout(() => {
    if (gameActive) nextQuestion();
  }, 350);
}

function finishGame() {
  gameActive = false;
  clearAllTimers();
  document.getElementById("game").style.display = "none";
  document.getElementById("result").style.display = "block";
  document.getElementById("resultText").textContent =
    "正解数：" + score + "　／　最後の更新間隔：" +
    (intervalMs / 1000).toFixed(2) + "秒";
}

function backToMenu() {
  gameActive = false;
  clearAllTimers();
  document.getElementById("game").style.display = "none";
  document.getElementById("result").style.display = "none";
  document.getElementById("modeArea").style.display = "block";
}

function clearAllTimers() {
  clearInterval(countdownId);
  clearInterval(numberId);
  clearTimeout(questionId);
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
</script>
</body>
</html>
