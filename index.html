
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUMBER LOGIC</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#10131c;
  color:#f3f5fc;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-align:center;
  min-height:100vh;
}
.container{
  width:min(520px,94%);
  margin:0 auto;
  padding:28px 0 40px;
}
h1{
  font-size:32px;
  letter-spacing:4px;
  margin:12px 0 6px;
}
.subtitle{
  color:#8d96ad;
  font-size:12px;
  letter-spacing:3px;
  margin-bottom:28px;
}
button{font:inherit;cursor:pointer}
.mode-buttons{
  display:flex;
  gap:12px;
  margin:24px 0;
}
.mode-button{
  flex:1;
  padding:17px 8px;
  border:1px solid #414960;
  border-radius:12px;
  background:#1b2130;
  color:#f3f5fc;
  font-weight:700;
  font-size:16px;
}
.mode-button:hover{background:#28334a}
.mode-button small{
  display:block;
  margin-top:7px;
  font-size:11px;
  color:#9da9c2;
  font-weight:400;
}
.info{
  color:#a7b0c6;
  font-size:13px;
  line-height:1.9;
}
.panel{
  border:1px solid #323b51;
  background:#181e2c;
  border-radius:14px;
  padding:17px 15px;
  margin:17px 0;
}
.topbar{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  font-size:13px;
  color:#b7c0d5;
}
#timer{
  color:#f6d365;
  font-size:25px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.progress{
  height:5px;
  background:#30384b;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}
#timebar{
  width:100%;
  height:100%;
  background:#f6d365;
  transition:width .08s linear;
}
.instruction{
  border:1px solid #46516b;
  border-radius:12px;
  background:#141a27;
  padding:20px 12px;
  margin:20px 0;
  line-height:2;
  font-size:17px;
  font-weight:650;
  overflow-wrap:anywhere;
}
.logic{
  display:inline-block;
  padding:1px 7px;
  margin:0 3px;
  border:1px solid #7483a4;
  border-radius:6px;
  background:#29334a;
  color:#d9e4ff;
  font-size:.9em;
  white-space:nowrap;
}
#numbers{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
  margin:22px 0;
}
.cell{position:relative;min-width:0}
.num{
  width:100%;
  aspect-ratio:1;
  border:1px solid #414b63;
  border-radius:12px;
  background:#20283a;
  color:#f3f5fc;
  font-size:24px;
  font-weight:750;
  transition:background .12s,border-color .12s,transform .12s;
}
.num:active{transform:scale(.94)}
.num.correct{
  background:#1d654e;
  border-color:#54d6a6;
  color:#eafff6;
}
.num.wrong{
  background:#742e3b;
  border-color:#ff5364;
  animation:shake .2s linear;
}
.num:disabled{cursor:default}
.penalty{
  position:absolute;
  z-index:2;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:19px;
  font-weight:900;
  color:#ff5364;
  text-shadow:0 1px 5px #101522;
  white-space:nowrap;
  pointer-events:none;
  animation:floatUp .85s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:0;translate:0 8px}
  20%{opacity:1}
  100%{opacity:0;translate:0 -35px}
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-3px)}
  75%{transform:translateX(3px)}
}
#message{
  min-height:24px;
  color:#b9c6e2;
  font-size:14px;
  margin:10px 0;
}
.scoreline{
  display:flex;
  justify-content:space-around;
  gap:10px;
  color:#aeb8ce;
  font-size:13px;
}
.scoreline strong{
  display:block;
  color:#f3f5fc;
  font-size:22px;
  margin-top:5px;
}
.primary{
  width:100%;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#627cf6;
  color:white;
  font-size:16px;
  font-weight:750;
  margin-top:12px;
}
.primary:hover{background:#7890ff}
.secondary{
  width:100%;
  padding:13px;
  border:1px solid #414960;
  border-radius:11px;
  background:#1b2130;
  color:#dce3f5;
  margin-top:10px;
}
.hidden{display:none!important}
#result h2{font-size:24px}
#resultScore{
  font-size:25px;
  font-weight:800;
  margin:25px 0;
}
.result-note{
  color:#aab4ca;
  font-size:13px;
  line-height:1.8;
}
@media(max-width:360px){
  .container{width:94%}
  #numbers{gap:7px}
  .num{font-size:21px}
  .instruction{font-size:15px}
}
</style>
</head>

<body>
<div class="container">
  <h1>NUMBER LOGIC</h1>
  <div class="subtitle">THINK FAST. FIND THE NUMBERS.</div>

  <section id="menu">
    <p class="info">
      お題の条件に当てはまる数字をタップしよう。<br>
      間違えると残り時間が減るぞ。
    </p>

    <div class="mode-buttons">
      <button class="mode-button" onclick="startGame('normal')">
        初級
        <small>制限時間 5秒</small>
      </button>
      <button class="mode-button" onclick="startGame('advanced')">
        上級
        <small>制限時間 10秒・自由な組み合わせ</small>
      </button>
    </div>

    <div class="panel info">
      数字は1〜10。正解をタップすると得点。<br>
      問題をクリアするたびに制限時間が短くなる。<br>
      誤答すると残り時間が1.5秒減る。
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="topbar">
      <span id="modeLabel">初級</span>
      <span>問題 <strong id="round">1</strong></span>
      <span>正解数 <strong id="score">0</strong></span>
      <span id="timer">5</span>
    </div>

    <div class="progress">
      <div id="timebar"></div>
    </div>

    <div id="instruction" class="instruction"></div>
    <div id="numbers"></div>
    <div id="message">当てはまる数字をすべて選ぼう！</div>

    <div class="scoreline panel">
      <div>今回の正解数<strong id="roundScore">0</strong></div>
      <div>挑戦した問題数<strong id="roundCount">0</strong></div>
    </div>

    <button class="secondary" onclick="backToMenu()">メニューに戻る</button>
  </section>

  <section id="result" class="hidden">
    <h2>GAME OVER</h2>
    <div id="resultScore"></div>
    <p class="result-note" id="resultNote"></p>
    <button class="primary" onclick="startGame(mode)">もう一度挑戦</button>
    <button class="secondary" onclick="backToMenu()">メニューに戻る</button>
  </section>
</div>

<script>
let mode="normal";
let q=null;
let score=0;
let questionLimit=5;
let round=0;
let active=false;
let countId=null;
let nextId=null;
let deadline=0;
let wrongPenalty=1.5;
let questionLocked=false;
let currentCorrect=new Set();
let selectedCorrect=new Set();
let questionAnswered=false;

/* iPhoneなど、振動に対応しない端末でも動くようにする */
function vibrate(pattern){
  try{
    if("vibrate" in navigator) navigator.vibrate(pattern);
  }catch(e){}
}

function clearTimers(){
  if(countId!==null){
    clearInterval(countId);
    countId=null;
  }
  if(nextId!==null){
    clearTimeout(nextId);
    nextId=null;
  }
}

/* 1〜10の条件を作るための部品 */
function makePredicates(){
  const predicates=[];

  predicates.push({
    type:"even",
    label:"偶数",
    test:n=>n%2===0
  });
  predicates.push({
    type:"odd",
    label:"奇数",
    test:n=>n%2!==0
  });
  predicates.push({
    type:"prime",
    label:"素数",
    test:n=>isPrime(n)
  });
  predicates.push({
    type:"notPrime",
    label:"素数ではない",
    test:n=>!isPrime(n)
  });
  predicates.push({
    type:"square",
    label:"平方数",
    test:n=>Number.isInteger(Math.sqrt(n))
  });
  predicates.push({
    type:"multiple3",
    label:"3の倍数",
    test:n=>n%3===0
  });
  predicates.push({
    type:"multiple4",
    label:"4の倍数",
    test:n=>n%4===0
  });
  predicates.push({
    type:"multiple5",
    label:"5の倍数",
    test:n=>n%5===0
  });
  predicates.push({
    type:"multiple7",
    label:"7の倍数",
    test:n=>n%7===0
  });
  predicates.push({
    type:"multiple2",
    label:"2の倍数",
    test:n=>n%2===0
  });

  predicates.push({
    type:"le3",
    label:"3以下",
    test:n=>n<=3
  });
  predicates.push({
    type:"le5",
    label:"5以下",
    test:n=>n<=5
  });
  predicates.push({
    type:"le7",
    label:"7以下",
    test:n=>n<=7
  });
  predicates.push({
    type:"ge4",
    label:"4以上",
    test:n=>n>=4
  });
  predicates.push({
    type:"ge6",
    label:"6以上",
    test:n=>n>=6
  });
  predicates.push({
    type:"ge8",
    label:"8以上",
    test:n=>n>=8
  });

  /* Nの約数。Nは問題ごとにランダムに変わる */
  const N=Math.floor(Math.random()*200)+1;
  predicates.push({
    type:"divisor",
    label:`${N}の約数`,
    test:n=>N%n===0
  });

  /* Nの倍数ではなく、Nで割り切れる数を1〜10から選ぶ条件 */
  return predicates;
}

function isPrime(n){
  if(n<2) return false;
  for(let i=2;i*i<=n;i++){
    if(n%i===0) return false;
  }
  return true;
}

function randomItem(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

/* 同じ条件が2回出るのを避けて、2つの条件を自由に選ぶ */
function makeAdvancedQuestion(){
  const predicates=makePredicates();
  const firstIndex=Math.floor(Math.random()*predicates.length);
  const first=predicates[firstIndex];

  const remaining=predicates.filter((p,i)=>i!==firstIndex);
  const second=randomItem(remaining);

  const connector=Math.random()<0.5?"and":"or";
  const negateFirst=Math.random()<0.25;
  const negateSecond=Math.random()<0.25;

  const testFirst=n=>negateFirst?!first.test(n):first.test(n);
  const testSecond=n=>negateSecond?!second.test(n):second.test(n);

  let labelFirst=first.label;
  let labelSecond=second.label;

  if(negateFirst) labelFirst=`${labelFirst}ではない`;
  if(negateSecond) labelSecond=`${labelSecond}ではない`;

  const connectorLabel=connector==="and"?"かつ":"または";
  const correct=[];

  for(let n=1;n<=10;n++){
    const a=testFirst(n);
    const b=testSecond(n);
    const ok=connector==="and"?(a&&b):(a||b);
    if(ok) correct.push(n);
  }

  return {
    label:`${labelFirst}<span class="logic">${connectorLabel}</span>${labelSecond}`,
    correct:correct,
    first:first,
    second:second,
    connector:connector,
    test:n=>{
      const a=testFirst(n);
      const b=testSecond(n);
      return connector==="and"?(a&&b):(a||b);
    }
  };
}

/* 初級は一つの条件を中心に出題 */
function makeNormalQuestion(){
  const predicates=makePredicates();
  const p=randomItem(predicates);
  const correct=[];

  for(let n=1;n<=10;n++){
    if(p.test(n)) correct.push(n);
  }

  return {
    label:p.label,
    correct:correct,
    test:p.test
  };
}

function makeQuestion(){
  let question;

  if(mode==="advanced"){
    question=makeAdvancedQuestion();
  }else{
    question=makeNormalQuestion();
  }

  /* 正解が0個または10個になる問題を避ける */
  if(question.correct.length===0 || question.correct.length===10){
    return makeQuestion();
  }

  return question;
}

function startGame(selectedMode){
  clearTimers();

  mode=selectedMode||mode;
  score=0;
  round=0;
  active=true;
  questionLocked=false;
  questionLimit=mode==="advanced"?10:5;

  document.getElementById("menu").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  document.getElementById("modeLabel").textContent=
    mode==="advanced"?"上級":"初級";

  document.getElementById("score").textContent="0";
  document.getElementById("roundScore").textContent="0";
  document.getElementById("roundCount").textContent="0";

  nextQuestion();
}

function nextQuestion(){
  if(!active) return;

  clearTimers();
  questionLocked=false;
  questionAnswered=false;
  selectedCorrect=new Set();

  q=makeQuestion();
  currentCorrect=new Set(q.correct);

  round++;
  document.getElementById("round").textContent=round;
  document.getElementById("instruction").innerHTML=q.label;
  document.getElementById("message").textContent=
    "当てはまる数字をすべて選ぼう！";

  const board=document.getElementById("numbers");
  board.innerHTML="";

  for(let n=1;n<=10;n++){
    const cell=document.createElement("div");
    cell.className="cell";

    const b=document.createElement("button");
    b.className="num";
    b.textContent=n;
    b.setAttribute("aria-label",`数字${n}`);
    b.addEventListener("click",()=>tap(b,cell,n));

    cell.appendChild(b);
    board.appendChild(cell);
  }

  document.getElementById("roundScore").textContent="0";
  document.getElementById("roundCount").textContent=round;

  deadline=Date.now()+questionLimit*1000;
  updateTimer();
  countId=setInterval(updateTimer,40);
}

function updateTimer(){
  if(!active||questionLocked) return;

  const remaining=(deadline-Date.now())/1000;
  const display=Math.max(0,Math.ceil(remaining));

  document.getElementById("timer").textContent=display;
  document.getElementById("timebar").style.width=
    Math.max(0,Math.min(100,remaining/questionLimit*100))+"%";

  if(remaining<=0){
    endGame();
  }
}

function tap(button,cell,n){
  if(!active||questionLocked||button.disabled) return;

  button.disabled=true;

  if(q.test(n)){
    button.classList.add("correct");
    selectedCorrect.add(n);
    score++;

    document.getElementById("score").textContent=score;
    document.getElementById("roundScore").textContent=selectedCorrect.size;
    document.getElementById("message").textContent="正解！";

    vibrate(15);

    /* 正解となる数字をすべて選んだら次の問題へ */
    if(selectedCorrect.size===currentCorrect.size){
      questionLocked=true;
      questionAnswered=true;
      clearTimers();

      vibrate([25,40,45]);

      questionLimit=Math.max(0.25,questionLimit-0.25);
      document.getElementById("message").textContent="全問正解！ 次の問題へ…";

      nextId=setTimeout(()=>{
        if(active) nextQuestion();
      },350);
    }
  }else{
    button.classList.add("wrong");

    deadline-=wrongPenalty*1000;

    const penalty=document.createElement("span");
    penalty.className="penalty";
    penalty.textContent="−1.5s";
    cell.appendChild(penalty);

    setTimeout(()=>{
      if(penalty.parentNode) penalty.remove();
    },900);

    document.getElementById("message").textContent="誤答！ −1.5秒";
    vibrate([70,35,70]);
    updateTimer();
  }
}

function endGame(){
  if(!active) return;

  active=false;
  questionLocked=true;
  clearTimers();

  document.querySelectorAll(".num").forEach(button=>{
    button.disabled=true;
  });

  document.getElementById("timer").textContent="0";
  document.getElementById("timebar").style.width="0%";
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("resultScore").textContent=
    `正解数：${score}個 / 挑戦した問題数：${round}問`;

  document.getElementById("resultNote").textContent=
    mode==="advanced"
      ?"上級に挑戦お疲れさま！ 条件の組み合わせを見抜こう。"
      :"挑戦お疲れさま！ 次はさらに記録を伸ばそう。";

  vibrate([80,50,120]);
}

function backToMenu(){
  active=false;
  questionLocked=true;
  clearTimers();

  try{
    if("vibrate" in navigator) navigator.vibrate(0);
  }catch(e){}

  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}
</script>
</body>
</html>
