
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUMBER LOGIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px 14px;background:#101522;color:#f3f5fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center}
h1{font-size:29px}
.sub,.note{color:#aab4cc}
.wrap{max-width:460px;margin:auto}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.modes,.stats{display:flex;gap:9px;margin:18px 0}
.mode,.stat{flex:1;padding:13px 5px;border:2px solid #46516b;border-radius:12px;background:#1a2234;color:white}
.mode strong,.stat strong{display:block;font-size:21px;margin-bottom:5px}
.mode small{color:#bdc7dc}
.selected{border-color:#71d7ff;background:#18364a}
.primary{padding:13px 24px;border:0;border-radius:10px;background:#71d7ff;color:#101522;font-weight:bold}
.secondary{margin:12px;padding:10px 18px;border:1px solid #53617e;border-radius:9px;background:transparent;color:#e0e7f7}
#game,#result{display:none}
.stat{font-size:12px;color:#bdc7dc;border-width:1px}
.stat strong{color:white;font-size:22px;margin:5px 0 0}
.instruction{padding:15px 10px;margin:15px 0;border:2px solid #7f91b7;border-radius:12px;background:#202b43}
.label{font-size:12px;color:#aebcda;margin-bottom:7px}
#prompt{font-size:20px;font-weight:bold;line-height:1.7}
.logic{display:inline-block;padding:1px 6px;border:1px solid #ffc66d;border-radius:5px;background:#49391f;color:#ffdb99}
#numbers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:16px 0}
.cell{position:relative;min-width:0}
.num{width:100%;aspect-ratio:1;border:1px solid #465573;border-radius:12px;background:#202a40;color:white;font-size:27px;font-weight:bold}
.num.correct{background:#17684d;border-color:#58e0a5}
.num.wrong{background:#792f3b;border-color:#ff7787;animation:shake .2s ease}
.num:disabled{cursor:default}
.penalty{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);font-size:19px;font-weight:900;color:#ff5364;text-shadow:0 1px 5px #101522;white-space:nowrap;pointer-events:none;animation:floatUp .85s ease-out forwards}
@keyframes floatUp{0%{opacity:0;translate:0 8px}20%{opacity:1}100%{opacity:0;translate:0 -35px}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#message{min-height:27px;margin:12px 0;font-weight:bold}
.note{font-size:12px;line-height:1.7;margin-top:14px}
button:disabled{cursor:default}
</style>
</head>
<body>

<h1>NUMBER LOGIC</h1>
<div class="sub">条件に合う数字をすべてタップ！</div>

<section id="menu" class="wrap">
  <div class="modes">
    <button class="mode selected" id="normalBtn" onclick="setMode('normal')">
      <strong>初級</strong><small>素数・偶数・倍数など</small>
    </button>
    <button class="mode" id="advancedBtn" onclick="setMode('advanced')">
      <strong>上級</strong><small>かつ・または・ではない</small>
    </button>
  </div>
  <button class="primary" onclick="startGame()">ゲームスタート</button>
  <div class="note">正解して次の問題に進むたび、制限時間が0.25秒ずつ短くなるよ。誤答は1.5秒のペナルティ！</div>
</section>

<section id="game" class="wrap">
  <div class="stats">
    <div class="stat">残り時間<strong id="time">5</strong></div>
    <div class="stat">正解数<strong id="score">0</strong></div>
    <div class="stat">問題数<strong id="round">1</strong></div>
  </div>

  <div class="instruction">
    <div class="label">今回の指示</div>
    <div id="prompt"></div>
  </div>

  <div id="numbers"></div>
  <div id="message">条件に合う数字をすべてタップ！</div>
  <button class="secondary" onclick="backToMenu()">モード選択に戻る</button>
</section>

<section id="result" class="wrap">
  <h2>ゲーム終了！</h2>
  <p id="resultText"></p>
  <button class="primary" onclick="startGame()">もう一度プレイ</button>
  <br>
  <button class="secondary" onclick="backToMenu()">モード選択に戻る</button>
</section>

<script>
const normalQuestions = [
  {text:"素数",test:n=>prime(n)},
  {text:"偶数",test:n=>n%2===0},
  {text:"奇数",test:n=>n%2!==0},
  {text:"3の倍数",test:n=>n%3===0},
  {text:"4の倍数",test:n=>n%4===0},
  {text:"5の倍数",test:n=>n%5===0},
  {text:"6の約数",test:n=>6%n===0},
  {text:"8以上の数",test:n=>n>=8},
  {text:"5未満の数",test:n=>n<5},
  {text:"10の約数",test:n=>10%n===0}
];

const advancedQuestions = [
  {text:'素数 <span class="logic">かつ</span> 偶数',test:n=>prime(n)&&n%2===0},
  {text:'3の倍数 <span class="logic">または</span> 5の倍数',test:n=>n%3===0||n%5===0},
  {text:'偶数 <span class="logic">ではない</span>',test:n=>n%2!==0},
  {text:'4の倍数 <span class="logic">かつ</span> 8未満',test:n=>n%4===0&&n<8},
  {text:'素数 <span class="logic">または</span> 1',test:n=>prime(n)||n===1},
  {text:'3の倍数 <span class="logic">でも</span> 5の倍数 <span class="logic">でもない</span>',test:n=>n%3!==0&&n%5!==0},
  {text:'2の倍数 <span class="logic">かつ</span> 3の倍数',test:n=>n%2===0&&n%3===0},
  {text:'6の約数 <span class="logic">または</span> 8の約数',test:n=>6%n===0||8%n===0},
  {text:'奇数 <span class="logic">かつ</span> 5以上',test:n=>n%2!==0&&n>=5},
  {text:'素数 <span class="logic">ではない</span> <span class="logic">かつ</span> 3以上',test:n=>!prime(n)&&n>=3}
];

let mode="normal";
let pool=[];
let q=null;
let score=0;
let questionLimit=5;
let round=0;
let active=false;
let countId=null;
let nextId=null;
let deadline=0;
let wrongPenalty=1.5;
let questionLocked=false;

function prime(n){
  if(n<2)return false;
  for(let i=2;i*i<=n;i++){
    if(n%i===0)return false;
  }
  return true;
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

function clearTimers(){
  clearInterval(countId);
  clearTimeout(nextId);
  countId=null;
  nextId=null;
}

// 対応ブラウザでは振動。未対応なら何もしない
function vibrate(pattern){
  try{
    if("vibrate" in navigator)navigator.vibrate(pattern);
  }catch(e){}
}

function setMode(m){
  if(active)return;
  mode=m;
  document.getElementById("normalBtn").classList.toggle("selected",m==="normal");
  document.getElementById("advancedBtn").classList.toggle("selected",m==="advanced");
}

function makePool(){
  const base=[...(mode==="normal"?normalQuestions:advancedQuestions)];

  // 1〜200の数字の約数を問う問題を追加
  for(let i=0;i<10;i++){
    const target=Math.floor(Math.random()*200)+1;
    const matches=[];
    for(let n=1;n<=10;n++){
      if(target%n===0)matches.push(n);
    }
    if(matches.length>0&&matches.length<10){
      base.push({
        text:`${target}の約数`,
        test:n=>target%n===0
      });
    }
  }

  shuffle(base);
  return base;
}

function startGame(){
  clearTimers();
  score=0;
  round=0;
  active=true;
  questionLocked=false;

  // 初級5秒、上級10秒
  questionLimit=mode==="advanced"?10:5;
  pool=makePool();

  document.getElementById("menu").style.display="none";
  document.getElementById("result").style.display="none";
  document.getElementById("game").style.display="block";
  document.getElementById("score").textContent="0";

  nextQuestion();
}

function nextQuestion(){
  if(!active)return;
  clearTimers();

  if(!pool.length)pool=makePool();
  q=pool.pop();

  round++;
  questionLocked=false;

  document.getElementById("time").textContent=String(Math.ceil(questionLimit));
  document.getElementById("round").textContent=String(round);
  document.getElementById("prompt").innerHTML=q.text;
  document.getElementById("message").textContent="条件に合う数字をすべてタップ！";

  const area=document.getElementById("numbers");
  area.innerHTML="";

  // 数字は1〜10を固定配置
  for(let n=1;n<=10;n++){
    const cell=document.createElement("div");
    cell.className="cell";

    const b=document.createElement("button");
    b.className="num";
    b.textContent=n;
    b.onclick=()=>tap(b,cell);

    cell.appendChild(b);
    area.appendChild(cell);
  }

  deadline=Date.now()+questionLimit*1000;

  countId=setInterval(()=>{
    if(!active||questionLocked)return;

    const remaining=Math.max(0,(deadline-Date.now())/1000);
    document.getElementById("time").textContent=String(Math.ceil(remaining));

    if(remaining<=0){
      endGame();
    }
  },20);
}

function tap(b,cell){
  if(!active||questionLocked||b.disabled)return;

  const n=Number(b.textContent);

  if(q.test(n)){
    b.classList.add("correct");
    b.disabled=true;
    score++;
    document.getElementById("score").textContent=String(score);

    // 正解時の軽い振動
    vibrate(15);

    const buttons=[...document.querySelectorAll(".num")];

    if(buttons.every(x=>!q.test(Number(x.textContent))||x.classList.contains("correct"))){
      questionLocked=true;
      clearInterval(countId);

      vibrate([25,40,45]);

      // 次の問題は0.25秒短くする
      questionLimit=Math.max(0.25,Math.round((questionLimit-0.25)*100)/100);

      document.getElementById("message").textContent="正解！ 次の問題へ";

      nextId=setTimeout(()=>{
        if(active)nextQuestion();
      },350);
    }else{
      const remaining=buttons.filter(
        x=>q.test(Number(x.textContent))&&!x.classList.contains("correct")
      ).length;
      document.getElementById("message").textContent=`正解！ あと${remaining}個`;
    }
  }else{
    // 誤答は1回につき1.5秒減らす
    b.classList.add("wrong");
    b.disabled=true;
    deadline-=wrongPenalty*1000;

    // 赤いペナルティ表示
    const penalty=document.createElement("span");
    penalty.className="penalty";
    penalty.textContent="−1.5s";
    cell.appendChild(penalty);
    setTimeout(()=>penalty.remove(),900);

    document.getElementById("message").textContent="誤答！ −1.5秒";
    vibrate([70,35,70]);

    const remaining=Math.max(0,(deadline-Date.now())/1000);
    document.getElementById("time").textContent=String(Math.ceil(remaining));

    if(remaining<=0){
      endGame();
    }
  }
}

function endGame(){
  if(!active)return;

  // 終了時に操作を止めて最終判定
  active=false;
  questionLocked=true;
  clearTimers();

  document.querySelectorAll(".num").forEach(b=>b.disabled=true);

  document.getElementById("time").textContent="0";
  document.getElementById("resultText").textContent=
    `正解数：${score}個 / 挑戦した問題数：${round}問`;

  document.getElementById("game").style.display="none";
  document.getElementById("result").style.display="block";

  vibrate([80,50,120]);
}

function backToMenu(){
  active=false;
  questionLocked=true;
  clearTimers();
  try{
    if("vibrate" in navigator)navigator.vibrate(0);
  }catch(e){}

  document.getElementById("game").style.display="none";
  document.getElementById("result").style.display="none";
  document.getElementById("menu").style.display="block";
}
</script>
</body>
</html>
